<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>草木集</title>
<meta name="description" content="随手拍的植物图鉴：拍照、辨认、手绘、按科归档">
<meta name="theme-color" content="#F1ECDD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141813" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="草木集">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://registry.npmmirror.com/lxgw-wenkai-screen-webfont/1.7.0/files/lxgwwenkaigbscreen.css" media="print" onload="this.media='all'">
<style>
/* 版式：手机单栏。整体是一只标本柜——页面是衬纸，每条记录是一张台纸，右下角贴一枚标本签。 */
:root {
  --bg: #F1ECDD;
  --surface: #FAF7EE;
  --ink: #25301F;
  --ink-soft: #5D6654;
  --leaf: #4B6836;
  --on-leaf: #FAF7EE;
  --pollen: #D6AB2B;
  --line: #D9D1BA;
  --danger: #A0442C;
  --scrim: rgba(20, 24, 18, 0.55);
  /* 台纸在深色模式下也保持纸色：AI 画出的图自带米白纸底，要和纸叠在一起看 */
  --sheet: #F8F4E8;
  --sheet-ink: #26311F;
  --sheet-soft: #626B58;
  --sheet-accent: #476433;
  --sheet-line: #D8CFB6;
  --label-bg: #EEE6CF;
  --font-hand: "LXGW WenKai Screen", "Kaiti SC", "STKaiti", "KaiTi", "BiauKai", serif;
  --font-ui: system-ui, -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "OPPO Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-latin: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .28 0 0 0 0 .18 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141813; --surface: #1C2118; --ink: #E7E2D2; --ink-soft: #A7AD99; --leaf: #9CBB7C; --on-leaf: #11150E;
    --pollen: #E4C04F; --line: #313828; --danger: #E3896B; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141813; --surface: #1C2118; --ink: #E7E2D2; --ink-soft: #A7AD99; --leaf: #9CBB7C; --on-leaf: #11150E;
  --pollen: #E4C04F; --line: #313828; --danger: #E3896B; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-ui);
  -webkit-tap-highlight-color: transparent; min-height: 100vh;
}
img { max-width: 100%; display: block; }
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--pollen); outline-offset: 2px; }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 顶栏 */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; min-height: 58px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font: 26px/1.1 var(--font-hand); letter-spacing: .04em; }
.brand .sub { color: var(--ink-soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon-btn:active { background: var(--surface); }
.icon-btn svg { width: 24px; height: 24px; }
.back { display: flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 8px 6px 8px 0; cursor: pointer; color: var(--ink); font-size: 15px; min-height: 44px; }
.back svg { width: 22px; height: 22px; }
.title-small { flex: 1; font: 19px/1.2 var(--font-hand); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main { padding-block: 14px calc(120px + env(safe-area-inset-bottom, 0px)); }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 15px; text-decoration: none; }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 20px; height: 20px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row.stretch > .btn { flex: 1 1 140px; }

.fab { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 10px; padding: 0 26px; height: 56px; border-radius: 999px; border: 0; background: var(--leaf); color: var(--on-leaf); font: 600 17px/1 var(--font-ui); letter-spacing: .06em; cursor: pointer; box-shadow: 0 8px 24px rgba(30, 40, 22, .28); }
.fab svg { width: 24px; height: 24px; }

/* 提示条 */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); margin-bottom: 16px; }
.notice p { margin: 0; flex: 1; min-width: 0; }
.notice.warn { border-color: var(--pollen); }
.notice.err { border-color: var(--danger); }
.notice.err p { color: var(--danger); }

/* 图鉴 */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 14px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--ink-soft); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); }
.tally { font: 15px/1.4 var(--font-hand); color: var(--ink-soft); }

.family { margin: 0 0 26px; }
.family-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.family-head h2 { margin: 0; font: 21px/1.2 var(--font-hand); }
.family-head .latin { color: var(--ink-soft); font-size: 14px; }
.family-head .count { margin-left: auto; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { display: block; text-decoration: none; color: inherit; min-width: 0; }
.tile .plate { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--sheet) var(--grain); border: 1px solid var(--sheet-line); }
.tile .plate img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.tile .plate img.photo { object-fit: cover; mix-blend-mode: normal; filter: sepia(.35) saturate(.8) brightness(1.02); opacity: .85; }
.tile .badge { position: absolute; left: 8px; bottom: 8px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: rgba(250, 247, 238, .92); color: #3A4430; border: 1px solid #D8CFB6; }
.tile .badge.bad { color: #9A3F28; }
.tile .name { margin: 8px 2px 0; font: 17px/1.3 var(--font-hand); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .meta { margin: 0 2px; font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.timeline .month { margin: 0 0 8px; font: 18px/1.3 var(--font-hand); color: var(--ink-soft); }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.row .thumb { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; background: var(--sheet) var(--grain); border: 1px solid var(--sheet-line); }
.row .thumb img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.row .thumb img.photo { object-fit: cover; mix-blend-mode: normal; }
.row .t1 { font: 18px/1.3 var(--font-hand); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { font-size: 13px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .day { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; text-align: right; }
.timeline section { margin-bottom: 24px; }

.empty { display: grid; gap: 18px; }
.empty .lead { margin: 0; font: 19px/1.6 var(--font-hand); }
.sample-tag { justify-self: start; display: inline-block; font-size: 12px; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 999px; padding: 1px 10px; }

/* 台纸（卡片） */
.sheet-card { position: relative; background: var(--sheet) var(--grain); color: var(--sheet-ink); border-radius: 6px; border: 1px solid var(--sheet-line); box-shadow: 0 1px 0 rgba(38, 48, 31, .05), 0 10px 26px rgba(38, 48, 31, .10); padding: 22px 20px 18px; max-width: 600px; margin: 0 auto; }
.sheet-card .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.sheet-card .name { margin: 0; font: 31px/1.2 var(--font-hand); letter-spacing: .03em; text-wrap: balance; }
.sheet-card .latin { font: italic 18px/1.3 var(--font-latin); padding-bottom: 3px; background: linear-gradient(transparent calc(100% - 2px), var(--pollen) 0) no-repeat 0 100% / 100% 100%; }
.latin .roman { font-style: normal; }
.sheet-card .prelim { margin: 6px 0 0; font: 16px/1.4 var(--font-hand); color: var(--sheet-soft); }
.sheet-card .art { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 14px; }
@media (min-width: 520px) { .sheet-card .art { grid-template-columns: minmax(0, 1fr) 150px; align-items: center; } }
.drawing { position: relative; aspect-ratio: 1; }
.drawing img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.drawing .pending { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
.drawing .pending img { position: absolute; inset: 12%; width: 76%; height: 76%; object-fit: cover; border-radius: 8px; filter: sepia(.5) saturate(.6) blur(1px); opacity: .35; mix-blend-mode: normal; }
.drawing .pending p { position: relative; margin: 0; font: 17px/1.6 var(--font-hand); color: var(--sheet-ink); }
.drawing .pending .sub { font: 13px/1.5 var(--font-ui); color: var(--sheet-soft); }
.callouts { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font: 18px/1.5 var(--font-hand); }
.callouts li::before { content: "↖ "; color: var(--sheet-soft); }
@media (min-width: 520px) { .callouts { flex-direction: column; gap: 14px; } .callouts li::before { content: "← "; } }
.sheet-card .obs { margin: 14px 0 0; font: 17.5px/1.75 var(--font-hand); }
.sheet-card .mine { margin: 8px 0 0; font: 17.5px/1.75 var(--font-hand); color: var(--sheet-accent); }
.sheet-card .foot { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: 18px; }
.sheet-card .taxon { font: 17px/1.4 var(--font-hand); }
.sheet-card .ai-mark { margin: 10px 0 0; font-size: 11px; color: var(--sheet-soft); text-align: right; }
.label-slip { margin-left: auto; min-width: 190px; max-width: 100%; background: var(--label-bg); border: 1px solid rgba(38, 49, 31, .45); outline: 1px solid rgba(38, 49, 31, .18); outline-offset: 2px; padding: 7px 10px 8px; font-size: 12px; line-height: 1.55; color: var(--sheet-ink); }
.label-slip .lh { font: 11px/1.4 var(--font-ui); letter-spacing: .14em; color: var(--sheet-soft); border-bottom: 1px solid rgba(38, 49, 31, .3); padding-bottom: 3px; margin-bottom: 4px; }
.label-slip dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; }
.label-slip dt { color: var(--sheet-soft); }
.label-slip dd { margin: 0; font-family: var(--font-hand); font-size: 13.5px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.detail-actions { max-width: 600px; margin: 16px auto 0; }
.panel { max-width: 600px; margin: 22px auto 0; }
.panel h3 { margin: 0 0 10px; font: 18px/1.3 var(--font-hand); }
.alt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.alt .an { font: 17px/1.3 var(--font-hand); }
.alt .ad { grid-column: 1 / -1; font-size: 13px; color: var(--ink-soft); }
.photo-orig { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.small-note { font-size: 13px; color: var(--ink-soft); }

/* 表单 */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .field .lbl { font-size: 13px; color: var(--ink-soft); }
.field input, .field textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.field textarea { min-height: 84px; resize: vertical; line-height: 1.6; }
.field.hand input, .field.hand textarea { font-family: var(--font-hand); font-size: 17px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
.chip.static { cursor: default; font-family: var(--font-hand); font-size: 15px; }
.section-title { margin: 22px 0 10px; font: 19px/1.3 var(--font-hand); }
.check-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.check-list li { display: flex; gap: 8px; align-items: baseline; }
.check-list .ok { color: var(--leaf); }
.check-list .bad { color: var(--danger); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; overflow-wrap: anywhere; }

/* 拍摄流程（全屏） */
.capture { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.capture .cap-top { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); }
.capture .cap-top .wrap { display: flex; align-items: center; min-height: 56px; gap: 8px; }
.capture .cap-top h2 { flex: 1; margin: 0; font: 21px/1.2 var(--font-hand); }
.capture .cap-body { padding-block: 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
.pick { display: grid; gap: 14px; margin-top: 8px; }
.pick label.big { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); cursor: pointer; font-size: 17px; min-height: 76px; }
.pick label.big.primary { background: var(--leaf); color: var(--on-leaf); border-color: var(--leaf); }
.pick label.big svg { width: 30px; height: 30px; flex: none; }
.pick input[type=file], .vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
.hint { color: var(--ink-soft); font: 16px/1.7 var(--font-hand); margin: 4px 0 0; }

.crop-stage { position: relative; margin: 0 auto 14px; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; border-radius: 10px; background: #000; max-width: 100%; }
.crop-stage img { width: 100%; height: auto; pointer-events: none; }
.crop-box { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 1600px rgba(0, 0, 0, .5); cursor: move; touch-action: none; }
.crop-box::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#fff6 0 0) 33.33% 0 / 1px 100% no-repeat, linear-gradient(#fff6 0 0) 66.66% 0 / 1px 100% no-repeat, linear-gradient(#fff6 0 0) 0 33.33% / 100% 1px no-repeat, linear-gradient(#fff6 0 0) 0 66.66% / 100% 1px no-repeat; pointer-events: none; }
.crop-box .h { position: absolute; width: 34px; height: 34px; touch-action: none; }
.crop-box .h::before { content: ""; position: absolute; width: 16px; height: 16px; border-color: #fff; border-style: solid; }
.crop-box .h[data-h=nw] { left: -10px; top: -10px; cursor: nwse-resize; } .crop-box .h[data-h=nw]::before { left: 8px; top: 8px; border-width: 4px 0 0 4px; }
.crop-box .h[data-h=ne] { right: -10px; top: -10px; cursor: nesw-resize; } .crop-box .h[data-h=ne]::before { right: 8px; top: 8px; border-width: 4px 4px 0 0; }
.crop-box .h[data-h=sw] { left: -10px; bottom: -10px; cursor: nesw-resize; } .crop-box .h[data-h=sw]::before { left: 8px; bottom: 8px; border-width: 0 0 4px 4px; }
.crop-box .h[data-h=se] { right: -10px; bottom: -10px; cursor: nwse-resize; } .crop-box .h[data-h=se]::before { right: 8px; bottom: 8px; border-width: 0 4px 4px 0; }

.working { display: grid; justify-items: center; gap: 16px; text-align: center; padding: 18px 0; }
.working .thumb { width: 168px; height: 168px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.working .thumb img { width: 100%; height: 100%; object-fit: cover; }
.working p { margin: 0; font: 19px/1.6 var(--font-hand); }
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); animation: bob 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-6px); opacity: 1; } }

.cands { display: grid; gap: 10px; margin: 6px 0 16px; }
.cand { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.cand[aria-checked="true"] { border-color: var(--leaf); box-shadow: inset 0 0 0 1px var(--leaf); }
.cand .radio { grid-row: span 3; width: 20px; height: 20px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--line); }
.cand[aria-checked="true"] .radio { border-color: var(--leaf); background: radial-gradient(var(--leaf) 45%, transparent 50%); }
.cand .cn { font: 20px/1.3 var(--font-hand); }
.cand .cn .latin { font-size: 15px; color: var(--ink-soft); margin-left: 6px; }
.cand .cf { font-size: 13px; color: var(--ink-soft); }
.cand .cf b { font-weight: 600; color: var(--ink); }
.cand .cw { font-size: 13.5px; color: var(--ink-soft); }
.meter { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 6px; }
.meter i { width: 14px; height: 5px; border-radius: 3px; background: var(--line); }
.meter i.on { background: var(--pollen); }
.pn-line { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: min(92vw, 520px); padding: 10px 16px; border-radius: 12px; background: #26311F; color: #F4F0E2; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="topbar"><div class="wrap" id="topbar"></div></header>
<main><div class="wrap" id="view"></div></main>
<button class="fab" id="fab" type="button" aria-label="拍一株新的植物">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8c.2-.3.6-.5 1-.5h3.4c.4 0 .8.2 1 .5L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.4" r="3.6"/></svg>
  拍一株

class UserError extends Error { constructor(msg, code) { super(msg); this.code = code || 'error'; } }

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ================= 设置（只存在这台手机的浏览器里） ================= */
const SETTINGS_KEY = 'caomuji.settings.v1';
const settings = (() => {
  const base = { relay: '', passcode: '', collector: '', lastPlace: '', view: 'family' };
  try { return { ...base, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') }; } catch { return base; }
})();
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch { /* 隐私模式下存不了 */ } }
const configured = () => Boolean(settings.relay && settings.passcode);

/* ================= 本机数据库 ================= */
const DB_NAME = 'caomuji';
const STORE = 'entries';
let dbPromise = null;
function openDb() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
      };
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }
  return dbPromise;
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function dbAll() { const d = await openDb(); return reqP(d.transaction(STORE).objectStore(STORE).getAll()); }
async function dbGet(id) { const d = await openDb(); return reqP(d.transaction(STORE).objectStore(STORE).get(id)); }
async function dbWrite(fn) {
  const d = await openDb();
  const t = d.transaction(STORE, 'readwrite');
  fn(t.objectStore(STORE));
  return new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('写入被中止')); });
}

let entries = [];
async function loadEntries() { entries = (await dbAll()).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))); return entries; }
async function saveEntry(e) {
  await dbWrite(s => s.put(e));
  const i = entries.findIndex(x => x.id === e.id);
  if (i >= 0) entries[i] = e; else entries.unshift(e);
  entries.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  askPersist();
}
async function deleteEntry(id) {
  await dbWrite(s => s.delete(id));
  entries = entries.filter(e => e.id !== id);
}
let persistAsked = false;
function askPersist() {
  if (persistAsked || !navigator.storage || !navigator.storage.persist) return;
  persistAsked = true;
  navigator.storage.persist().catch(() => {});
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const urlCache = new WeakMap();
function blobURL(b) {
  if (!b) return '';
  let u = urlCache.get(b);
  if (!u) { u = URL.createObjectURL(b); urlCache.set(b, u); }
  return u;
}

/* ================= 图片工具 ================= */
function canvasToBlob(c, type = 'image/jpeg', q = 0.88) {
  return new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error('图片导出失败'))), type, q));
}
function blobToDataURL(b) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
}
function dataURLToBlob(u) {
  const [head, b64] = String(u).split(',');
  const mime = (/data:([^;]+)/.exec(head) || [])[1] || 'application/octet-stream';
  const bin = atob(b64 || '');
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function decodeImage(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { /* 退回 <img> */ }
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.decoding = 'async'; img.src = url;
    await img.decode();
    return img;
  } catch {
    throw new UserError('这张图打不开，换一张试试（有些格式手机浏览器不支持）', 'decode');
  } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
const srcSize = src => ({ w: src.naturalWidth || src.width, h: src.naturalHeight || src.height });
function drawScaled(src, sx, sy, sw, sh, maxSide) {
  const s = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * s)), h = Math.max(1, Math.round(sh * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
  return c;
}
async function recompress(blob, maxSide = 1280, q = 0.9) {
  const src = await decodeImage(blob);
  const { w, h } = srcSize(src);
  return canvasToBlob(drawScaled(src, 0, 0, w, h, maxSide), 'image/jpeg', q);
}
// 把画里自带的纸色校成纯白，这样叠到卡片的纸上不会出现一块方形的底
async function prepareDrawing(blob) {
  const src = await decodeImage(blob);
  const { w, h } = srcSize(src);
  const c = drawScaled(src, 0, 0, w, h, 1280);
  const g = c.getContext('2d');
  const W = c.width, H = c.height;
  const img = g.getImageData(0, 0, W, H);
  const d = img.data;
  const m = Math.max(4, Math.round(Math.min(W, H) * 0.03));
  const rs = [], gs = [], bs = [];
  for (let y = 0; y < H; y += 3) {
    for (let x = 0; x < W; x += 3) {
      if (x >= m && x < W - m && y >= m && y < H - m) continue;
      const i = (y * W + x) * 4; rs.push(d[i]); gs.push(d[i + 1]); bs.push(d[i + 2]);
    }
  }
  const pick = a => { a.sort((p, q) => p - q); return a[Math.floor(a.length * 0.6)] || 255; };
  const pr = pick(rs), pg = pick(gs), pb = pick(bs);
  if (Math.min(pr, pg, pb) > 170) {
    const kr = 255 / pr, kg = 255 / pg, kb = 255 / pb;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = Math.min(255, d[i] * kr); d[i + 1] = Math.min(255, d[i + 1] * kg); d[i + 2] = Math.min(255, d[i + 2] * kb);
    }
    g.putImageData(img, 0, 0);
  }
  return canvasToBlob(c, 'image/jpeg', 0.9);
}

/* ================= 和中转通信 ================= */
async function api(path, body, { signal, timeout = 120000 } = {}) {
  if (!configured()) throw new UserError('还没连上中转：先到设置里填中转地址和口令', 'setup');
  const url = settings.relay.trim().replace(/\/+$/, '') + path;
  const ctl = new AbortController();
  let why = '';
  const timer = setTimeout(() => { why = 'timeout'; ctl.abort(); }, timeout);
  const onAbort = () => { why = 'cancel'; ctl.abort(); };
  if (signal) signal.addEventListener('abort', onAbort);
  try {
    const res = await fetch(url, {
      method: body ? 'POST' : 'GET',
      headers: { 'X-Passcode': settings.passcode, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
      signal: ctl.signal,
      cache: 'no-store',
    });
    let data = null;
    try { data = await res.json(); } catch { data = null; }
    if (!res.ok) throw new UserError((data && data.error) || `中转返回了 ${res.status}`, (data && data.code) || 'http_' + res.status);
    return data || {};
  } catch (e) {
    if (e instanceof UserError) throw e;
    if (why === 'cancel') throw new UserError('已取消', 'cancelled');
    if (why === 'timeout') throw new UserError('等太久了，可能是网络不好，再试一次', 'timeout');
    throw new UserError('连不上中转。看看网络，或者到设置里点「测试连接」', 'network');
  } finally {
    clearTimeout(timer);
    if (signal) signal.removeEventListener('abort', onAbort);
  }
}

/* ================= 画图任务（在后台跑，可以先去拍下一株） ================= */
const drawing = new Map();
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { /* 不支持就算了 */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && drawing.size) keepAwake(true); });

async function startDraw(id) {
  const entry = entries.find(e => e.id === id);
  if (!entry || drawing.has(id)) return;
  entry.drawStatus = 'drawing'; entry.drawError = ''; entry.drawStartedAt = Date.now();
  await saveEntry(entry);
  drawing.set(id, Date.now());
  keepAwake(true);
  rerender();
  try {
    const image = await blobToDataURL(entry.crop);
    const data = await api('/draw', {
      image,
      species: entry.species ? { zh: entry.species.zh, latin: entry.species.latin } : null,
      features: entry.features || [],
      hint: entry.drawHint || '',
    }, { timeout: 300000 });
    const art = await prepareDrawing(dataURLToBlob(data.image));
    const fresh = entries.find(e => e.id === id);
    if (!fresh) return;
    fresh.drawing = art; fresh.drawStatus = 'done'; fresh.drawError = ''; fresh.drawnAt = new Date().toISOString();
    await saveEntry(fresh);
    toast(`${displayName(fresh)} 画好了`);
  } catch (e) {
    const fresh = entries.find(x => x.id === id);
    if (!fresh) return;
    fresh.drawStatus = 'failed'; fresh.drawError = e.message || String(e);
    await saveEntry(fresh);
    toast('没画成：' + fresh.drawError);
  } finally {
    drawing.delete(id);
    if (!drawing.size) keepAwake(false);
    rerender();
  }
}

/* ================= 文本小工具 ================= */
const displayName = e => (e.species && (e.species.zh || e.species.latin)) || '还没认出来';
function latinHTML(latin) {
  if (!latin) return '';
  return esc(latin).split(/(\s+)/).map(w => (/^(sp\.|spp\.|var\.|subsp\.|ssp\.|f\.|cv\.|×)$/.test(w) ? `<span class="roman">${w}</span>` : w)).join('');
}
function confWord(c) {
  if (c == null || Number.isNaN(c)) return '';
  if (c >= 0.75) return '把握较大';
  if (c >= 0.45) return '有可能';
  return '拿不准';
}
function meter(c) {
  const n = c >= 0.75 ? 3 : c >= 0.45 ? 2 : 1;
  return `<span class="meter" aria-hidden="true">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
}
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}
const pad = (n, w = 4) => String(n || 0).padStart(w, '0');
function taxonLine(e) {
  const s = e.species || {};
  return [s.family_zh || s.family_latin, s.genus_zh || s.genus_latin, e.form && e.form !== '不确定' ? e.form : ''].filter(Boolean).join(' · ');
}
function splitFeatures(text) { return String(text || '').split(/[，,、；;\n]+/).map(s => s.trim()).filter(Boolean).slice(0, 6); }

/* ================= 路由（自己记历史深度，返回键和页面里的返回按钮行为一致） ================= */
let currentView = '';
function route() {
  const h = location.hash || '#/';
  if (h === '#/new') { if (!currentView) renderCollection(); openCapture(); return; }
  closeCaptureUI();
  if (h.startsWith('#/e/')) return renderDetail(decodeURIComponent(h.slice(4)));
  if (h === '#/settings') return renderSettings();
  return renderCollection();
}
function nav(hash, { replace = false } = {}) {
  const depth = (history.state && history.state.depth) || 0;
  if (replace) history.replaceState({ depth }, '', hash);
  else history.pushState({ depth: depth + 1 }, '', hash);
  route();
}
function goBack(fallback = '#/') {
  if (history.state && history.state.depth > 0) history.back();
  else nav(fallback, { replace: true });
}
function rerender() {
  const h = location.hash || '#/';
  if (h === '#/new' || currentView === 'settings') return;
  if (currentView === 'detail' && h.startsWith('#/e/')) { refreshDetail(decodeURIComponent(h.slice(4))); return; }
  route();
}
window.addEventListener('popstate', route);
document.addEventListener('click', ev => {
  const a = ev.target.closest && ev.target.closest('a[href^="#/"]');
  if (!a || ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;

});

/* ================= 存成图片（分享到微信、小红书） ================= */
async function shareCard(e) {
  if (!e.drawing) throw new UserError('还没画好，画好了才能存成图片');
  const W = 1080, H = 1440, M = 72;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const HAND = '"LXGW WenKai Screen", "Kaiti SC", "STKaiti", "KaiTi", serif';
  const LATIN = '"Iowan Old Style", Palatino, Georgia, serif';
  const s = e.species || {};
  const allText = [displayName(e), e.aiNote, e.myNote, taxonLine(e), e.place, fmtDate(e.createdAt), settings.collector, (e.features || []).join(''), '初步判断有可能把握较大拿不准还没认出来草木集植物记录编号地点日期记录图依照片绘制·←'].join('');
  try { await Promise.all([document.fonts.load(`40px ${HAND}`, allText), document.fonts.load(`italic 40px ${LATIN}`, s.latin || 'a')]); } catch { /* 用备用字体 */ }

  // 纸
  g.fillStyle = '#F8F4E8'; g.fillRect(0, 0, W, H);
  const noise = document.createElement('canvas'); noise.width = noise.height = 180;
  const ng = noise.getContext('2d'); const id = ng.createImageData(180, 180);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = 90; id.data[i + 1] = 80; id.data[i + 2] = 50; id.data[i + 3] = v < 230 ? 0 : 18; }
  ng.putImageData(id, 0, 0); g.fillStyle = g.createPattern(noise, 'repeat'); g.fillRect(0, 0, W, H);

  // 标题
  const ink = '#26311F', soft = '#626B58', accent = '#476433', pollen = '#D6AB2B';
  g.textBaseline = 'alphabetic';
  const name = displayName(e);
  let nameSize = 76;
  g.fillStyle = ink; g.font = `${nameSize}px ${HAND}`;
  while (g.measureText(name).width > W - 2 * M && nameSize > 40) { nameSize -= 4; g.font = `${nameSize}px ${HAND}`; }
  g.fillText(name, M, 150);
  let y = 150;
  if (s.latin) {
    const nameW = g.measureText(name).width;
    g.font = `italic 42px ${LATIN}`;
    const lw = g.measureText(s.latin).width;
    let lx = M + nameW + 30, ly = 150;
    if (lx + lw > W - M) { lx = M; ly = 216; y = 216; }
    g.fillStyle = ink; g.fillText(s.latin, lx, ly);
    g.strokeStyle = pollen; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(lx, ly + 14); g.quadraticCurveTo(lx + lw / 2, ly + 19, lx + lw + 8, ly + 12); g.stroke();
  }
  const prelim = !s.manual && s.zh && s.confidence != null && s.confidence < 0.75 ? `初步判断 · ${confWord(s.confidence)}` : (!e.species ? '还没认出来，先记下' : '');
  if (prelim) { y += 58; g.fillStyle = soft; g.font = `36px ${HAND}`; g.fillText(prelim, M, y); }

  // 先排观察和笔记（总共最多 4 行，写不下就截断），再按剩下的高度定画的大小
  function lay(text, maxW) {
    const lines = []; let line = '';
    for (const ch of [...text]) { if (g.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch; }
    if (line) lines.push(line);
    return lines;
  }
  g.font = `36px ${HAND}`;
  const budget = 4, lh = 54, textW = W - 2 * M;
  let aiLines = e.aiNote ? lay(e.aiNote, textW) : [];
  let myLines = e.myNote ? lay(e.myNote, textW) : [];
  const myKeep = Math.min(myLines.length, aiLines.length ? 2 : budget);
  const aiKeep = Math.min(aiLines.length, budget - myKeep);
  const cut = (lines, n) => (lines.length > n ? [...lines.slice(0, n - 1), lines[n - 1].slice(0, -1) + '…'] : lines);
  aiLines = aiKeep ? cut(aiLines, aiKeep) : [];
  myLines = myKeep ? cut(myLines, myKeep) : [];
  const nLines = aiLines.length + myLines.length;
  const lw2 = 360, lh2 = 150, lx2 = W - M - lw2, ly2 = H - 62 - lh2;
  const by = y + 34, bx = 46;
  const room = nLines ? ly2 - 40 - 58 - (nLines - 1) * lh - by : ly2 - 40 - by;
  const box = Math.round(clamp(room, 520, 720));

  // 画（左），特征（右）
  const art = await decodeImage(e.drawing);
  const { w: aw, h: ah } = srcSize(art);
  const sc = Math.min(box / aw, box / ah);
  g.globalCompositeOperation = 'multiply';
  g.drawImage(art, bx + (box - aw * sc) / 2, by + (box - ah * sc) / 2, aw * sc, ah * sc);
  g.globalCompositeOperation = 'source-over';
  const fx = bx + box + 22, fMax = W - 40 - fx;
  (e.features || []).slice(0, 4).forEach((f, i) => {
    let size = 38;
    g.font = `${size}px ${HAND}`;
    while (g.measureText('← ' + f).width > fMax && size > 24) { size -= 2; g.font = `${size}px ${HAND}`; }
    g.fillStyle = ink; g.fillText('← ' + f, fx, by + Math.round(box * 0.24) + i * 104);
  });

  g.font = `36px ${HAND}`;
  let ty = by + box + 58;
  g.fillStyle = ink; aiLines.forEach(l => { g.fillText(l, M, ty); ty += lh; });
  g.fillStyle = accent; myLines.forEach(l => { g.fillText(l, M, ty); ty += lh; });

  // 底部：科属 + 标本签
  g.fillStyle = ink; g.font = `34px ${HAND}`;
  let tax = taxonLine(e);
  while (tax && g.measureText(tax).width > lx2 - M - 24) tax = tax.slice(0, -1);
  g.fillText(tax, M, ly2 + lh2 - 12);
  g.fillStyle = '#EEE6CF'; g.fillRect(lx2, ly2, lw2, lh2);
  g.strokeStyle = 'rgba(38,49,31,.5)'; g.lineWidth = 2; g.strokeRect(lx2, ly2, lw2, lh2);
  g.strokeStyle = 'rgba(38,49,31,.2)'; g.lineWidth = 1.5; g.strokeRect(lx2 - 5, ly2 - 5, lw2 + 10, lh2 + 10);
  g.fillStyle = soft; g.font = `21px ${HAND}`; g.fillText('草木集 · 植物记录', lx2 + 16, ly2 + 31);
  g.fillRect(lx2 + 16, ly2 + 42, lw2 - 32, 1.5);
  const rows = [['编号', 'No. ' + pad(e.no)], ['地点', e.place || '—'], ['日期', fmtDate(e.createdAt)]];
  if (settings.collector) rows.push(['记录', settings.collector]);
  rows.slice(0, 4).forEach(([k, val], i) => {
    const ry = ly2 + 68 + i * 25;
    g.fillStyle = soft; g.font = `19px ${HAND}`; g.fillText(k, lx2 + 16, ry);
    g.fillStyle = ink; g.font = `21px ${HAND}`;
    let v = val; while (g.measureText(v).width > lw2 - 90 && v.length > 1) v = v.slice(0, -1);
    g.fillText(v === val ? v : v + '…', lx2 + 70, ry);
  });
  g.fillStyle = soft; g.font = `19px ${HAND}`;
  g.fillText('图：AI 依照片绘制', W - M - g.measureText('图：AI 依照片绘制').width, H - 26);

  const blob = await canvasToBlob(c, 'image/jpeg', 0.92);
  const fname = `草木集-${pad(e.no)}-${name}.jpg`;
  const file = new File([blob], fname, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  downloadBlob(blob, fname);
  toast('卡片图片已保存');
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

}
async function exportBackup() {
  const out = { app: 'caomuji', version: 1, exportedAt: new Date().toISOString(), entries: [] };
  for (const e of entries) {
    out.entries.push({ ...e, crop: e.crop ? await blobToDataURL(e.crop) : null, drawing: e.drawing ? await blobToDataURL(e.drawing) : null });
  }
  const d = new Date();
  downloadBlob(new Blob([JSON.stringify(out)], { type: 'application/json' }), `草木集备份-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`);
  toast(`导出了 ${out.entries.length} 条`);
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { throw new UserError('这个文件读不出来'); }
  if (!data || data.app !== 'caomuji' || !Array.isArray(data.entries)) throw new UserError('这不是草木集的备份文件');
  let n = 0;
  for (const raw of data.entries) {
    if (!raw || !raw.id) continue;
    const e = { ...raw, crop: raw.crop ? dataURLToBlob(raw.crop) : null, drawing: raw.drawing ? dataURLToBlob(raw.drawing) : null };
    if (e.drawStatus === 'drawing') e.drawStatus = e.drawing ? 'done' : 'failed';
    await saveEntry(e);
    n++;
  }
  toast(`导入了 ${n} 条`);
  renderSettings();
}

/* ================= 拍一株：选图 → 框选 → 辨认 → 确认 ================= */
const ORGANS = [['auto', '自动'], ['flower', '花'], ['leaf', '叶'], ['fruit', '果'], ['bark', '树皮']];
let cap = null;
function freshCapture() {
  return { step: 'pick', src: null, w: 0, h: 0, previewURL: '', rect: { x: 0.1, y: 0.1, w: 0.8, h: 0.8 }, organ: 'auto', place: settings.lastPlace || '', crop: null, cropURL: '', res: null, error: '', ctl: null, choice: 0, manualZh: '', manualLatin: '' };
}
function openCapture() {
  if (!cap) cap = freshCapture();
  $('#capture').hidden = false;
  document.body.style.overflow = 'hidden';
  renderCapture();
}
function closeCaptureUI() {
  if ($('#capture').hidden) return;
  $('#capture').hidden = true;
  document.body.style.overflow = '';
  if (cap && cap.ctl) cap.ctl.abort();
  if (cap && cap.previewURL) URL.revokeObjectURL(cap.previewURL);
  if (cap && cap.cropURL) URL.revokeObjectURL(cap.cropURL);
  cap = null;
}
$('#cap-close').addEventListener('click', () => goBack('#/'));

function renderCapture() {
  const body = $('#cap-body');
  const title = $('#cap-title');
  if (cap.step === 'pick') {
    title.textContent = '拍一株';
    body.innerHTML = `${configured() ? '' : '<div class="notice warn"><p>还没连上中转，辨认和画图都用不了。可以先拍，回头到设置里填好再说。</p></div>'}
      <div class="pick">
        <label class="big primary" for="pick-cam">${ICON.camera}<span>拍照</span></label>
        <input id="pick-cam" type="file" accept="image/*" capture="environment">
        <label class="big" for="pick-lib">${ICON.album}<span>从相册选</span></label>
        <input id="pick-lib" type="file" accept="image/*">
      </div>
      <p class="hint">离近一点，把花或叶子拍清楚。照片里有好几种植物也没关系，下一步可以框出你想记的那一株。</p>`;
    const onPick = ev => { const f = ev.target.files && ev.target.files[0]; if (f) usePicked(f); };
    $('#pick-cam').addEventListener('change', onPick);
    $('#pick-lib').addEventListener('change', onPick);
    return;
  }
  if (cap.step === 'loading') {
    title.textContent = '拍一株';
    body.innerHTML = '<div class="working"><span class="dots"><i></i><i></i><i></i></span><p>打开照片…</p></div>';
    return;
  }
  if (cap.step === 'crop') {
    title.textContent = '框出这一株';
    body.innerHTML = `<div class="crop-stage" id="stage"><img src="${cap.previewURL}" alt="刚拍的照片"><div class="crop-box" id="cbox">
        <span class="h" data-h="nw"></span><span class="h" data-h="ne"></span><span class="h" data-h="sw"></span><span class="h" data-h="se"></span></div></div>
      <p class="hint" style="margin-bottom:14px">拖动框，或者拖四个角，只框你想记的那一株。</p>
      <div class="field"><span class="lbl">主要拍的是</span><div class="chips" id="organs">${ORGANS.map(([k, t]) => `<button class="chip" type="button" data-o="${k}" aria-pressed="${cap.organ === k}">${t}</button>`).join('')}</div></div>
      <div class="field hand"><label for="cap-place">在哪儿看到的</label><input id="cap-place" value="${esc(cap.place)}" placeholder="比如：公司楼下、江边步道"></div>
      <div class="btn-row stretch"><button class="btn" type="button" id="cap-repick">重新选</button><button class="btn primary" type="button" id="cap-go">认一认</button></div>`;
    const stage = $('#stage'), box = $('#cbox');
    // 竖图太高时限制显示高度，免得框选区超出屏幕
    const maxH = Math.max(260, window.innerHeight * 0.58);
    stage.style.width = `min(100%, ${Math.round(maxH * cap.w / cap.h)}px)`;
    placeBox(box);
    bindCrop(stage, box);
    $$('#organs .chip').forEach(b => b.addEventListener('click', () => { cap.organ = b.dataset.o; $$('#organs .chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
    $('#cap-place').addEventListener('input', ev => { cap.place = ev.target.value; });
    $('#cap-repick').addEventListener('click', () => { cap = { ...freshCapture(), place: cap.place }; renderCapture(); });
    $('#cap-go').addEventListener('click', identify);
    return;
  }
  if (cap.step === 'identifying') {
    title.textContent = '认一认';
    body.innerHTML = `<div class="working">
        <div class="thumb"><img src="${cap.cropURL}" alt="框出的这一株"></div>
        <span class="dots"><i></i><i></i><i></i></span>
        <p id="work-msg">PlantNet 在比对…</p>
        <button class="btn ghost" type="button" id="cap-cancel">取消</button>
      </div>`;
    $('#cap-cancel').addEventListener('click', () => cap.ctl && cap.ctl.abort());
    const msgs = ['PlantNet 在比对…', '豆包在看细节…', '在对照花和叶的特征…', '快好了…'];
    let i = 0;
    const tick = setInterval(() => {
      const m = $('#work-msg');
      if (!m || !cap || cap.step !== 'identifying') { clearInterval(tick); return; }
      i = Math.min(i + 1, msgs.length - 1); m.textContent = msgs[i];
    }, 4500);
    return;
  }
  if (cap.step === 'error') {
    title.textContent = '认一认';
    body.innerHTML = `<div class="notice err"><p>${esc(cap.error)}</p></div>
      ${cap.cropURL ? `<div class="working"><div class="thumb"><img src="${cap.cropURL}" alt="框出的这一株"></div></div>` : ''}
      <div class="btn-row stretch">
        <button class="btn primary" type="button" id="err-retry">再试一次</button>
        <button class="btn" type="button" id="err-save">先记下，不辨认</button>
      </div>
      ${configured() ? '' : '<p class="small-note" style="margin-top:12px"><a href="#/settings">去设置</a></p>'}`;
    $('#err-retry').addEventListener('click', identify);
    $('#err-save').addEventListener('click', () => { cap.choice = 'unknown'; cap.res = null; commit(false); });
    return;
  }
  if (cap.step === 'confirm') {
    title.textContent = '像哪一种？';
    const r = cap.res.result || {};
    const cands = r.candidates || [];
    const pn = cap.res.plantnet;
    let pnLine = '';
    if (cap.res.plantnetSkipped) pnLine = '没设置 PlantNet，这次只靠豆包。';
    else if (cap.res.plantnetError) pnLine = esc(cap.res.plantnetError) + '，这次只靠豆包。';
    else if (pn && pn.length) pnLine = `PlantNet 比对：${pn.slice(0, 2).map(p => `<i>${esc(p.latin)}</i> ${Math.round(p.score * 100)}%`).join('，')}${cap.res.plantnetRemaining != null ? `　今天还能用 ${cap.res.plantnetRemaining} 次` : ''}`;
    else if (pn) pnLine = 'PlantNet 没认出来。';
    body.innerHTML = `
      <div class="cands" role="radiogroup" aria-label="候选">
        ${cands.map((c, i) => `<button class="cand" type="button" role="radio" data-i="${i}" aria-checked="${cap.choice === i}">
            <span class="radio"></span>
            <span class="cn">${esc(c.zh || c.latin)}${c.latin ? `<i class="latin">${latinHTML(c.latin)}</i>` : ''}</span>
            <span class="cf">${meter(c.confidence)}<b>${esc(confWord(c.confidence))}</b>${c.family_zh ? ' · ' + esc(c.family_zh) : ''}</span>
            ${c.why ? `<span class="cw">${esc(c.why)}</span>` : ''}
          </button>`).join('')}
        <button class="cand" type="button" role="radio" data-i="manual" aria-checked="${cap.choice === 'manual'}">
          <span class="radio"></span><span class="cn">我知道它叫什么</span><span class="cw">自己填名字</span>
        </button>
        <button class="cand" type="button" role="radio" data-i="unknown" aria-checked="${cap.choice === 'unknown'}">
          <span class="radio"></span><span class="cn">都不像，先记为待定</span><span class="cw">以后知道了可以再改</span>
        </button>
      </div>
      <div id="manual" ${cap.choice === 'manual' ? '' : 'hidden'}>
        <div class="two">
          <div class="field hand"><label for="m-zh">中文名</label><input id="m-zh" value="${esc(cap.manualZh)}"></div>
          <div class="field"><label for="m-latin">学名（可不填）</label><input id="m-latin" value="${esc(cap.manualLatin)}" autocapitalize="off" spellcheck="false"></div>
        </div>
      </div>
      ${pnLine ? `<p class="pn-line">${pnLine}</p>` : ''}
      ${(r.features || []).length ? `<div class="field"><span class="lbl">看得出来的特征</span><div class="chips">${r.features.map(f => `<span class="chip static">${esc(f)}</span>`).join('')}</div></div>` : ''}
      <div class="field hand"><label for="c-obs">观察（可以改）</label><textarea id="c-obs">${esc(r.note || '')}</textarea></div>
      <div class="field hand"><label for="c-mine">我的一句话（可不填）</label><textarea id="c-mine" placeholder="比如：公司楼下那丛，开了一整个秋天。"></textarea></div>
      <div class="btn-row stretch">
        <button class="btn primary" type="button" id="c-draw">就它了，画出来</button>
        <button class="btn" type="button" id="c-save">只记下，不画</button>
      </div>`;
    $$('.cand', body).forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.i;
      cap.choice = v === 'manual' || v === 'unknown' ? v : Number(v);
      $$('.cand', body).forEach(x => x.setAttribute('aria-checked', String(x === b)));
      $('#manual').hidden = cap.choice !== 'manual';
      if (cap.choice === 'manual') $('#m-zh').focus();
    }));
    $('#c-draw').addEventListener('click', () => commit(true));
    $('#c-save').addEventListener('click', () => commit(false));
  }
}

async function usePicked(file) {
  cap.step = 'loading'; renderCapture();
  try {
    const src = await decodeImage(file);
    const { w, h } = srcSize(src);
    cap.src = src; cap.w = w; cap.h = h;
    const prev = drawScaled(src, 0, 0, w, h, 1400);
    cap.previewURL = URL.createObjectURL(await canvasToBlob(prev, 'image/jpeg', 0.9));
    cap.rect = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
    cap.step = 'crop';
  } catch (e) {
    cap.step = 'pick'; toast(e.message || '这张图打不开');
  }
  renderCapture();
}
function placeBox(box) {
  const r = cap.rect;
  Object.assign(box.style, { left: r.x * 100 + '%', top: r.y * 100 + '%', width: r.w * 100 + '%', height: r.h * 100 + '%' });
}
function bindCrop(stage, box) {
  let drag = null;
  box.addEventListener('pointerdown', ev => {
    const r = stage.getBoundingClientRect();
    drag = { h: ev.target.dataset.h || 'move', x0: ev.clientX, y0: ev.clientY, rect: { ...cap.rect }, W: r.width, H: r.height, pid: ev.pointerId };
    try { ev.target.setPointerCapture(ev.pointerId); } catch { /* 忽略 */ }
    ev.preventDefault();
  });
  box.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.pid) return;
    const dx = (ev.clientX - drag.x0) / drag.W, dy = (ev.clientY - drag.y0) / drag.H, min = 0.12;
    let { x, y, w, h } = drag.rect;
    if (drag.h === 'move') { x = clamp(x + dx, 0, 1 - w); y = clamp(y + dy, 0, 1 - h); }
    else {
      if (drag.h.includes('w')) { const nx = clamp(x + dx, 0, x + w - min); w += x - nx; x = nx; }
      if (drag.h.includes('e')) w = clamp(w + dx, min, 1 - x);
      if (drag.h.includes('n')) { const ny = clamp(y + dy, 0, y + h - min); h += y - ny; y = ny; }
      if (drag.h.includes('s')) h = clamp(h + dy, min, 1 - y);
    }
    cap.rect = { x, y, w, h };
    placeBox(box);
  });
  const end = () => { drag = null; };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
}
async function makeCrop() {
  const { x, y, w, h } = cap.rect;
  const c = drawScaled(cap.src, x * cap.w, y * cap.h, w * cap.w, h * cap.h, 1280);
  return canvasToBlob(c, 'image/jpeg', 0.88);
}
async function identify() {
  const my = cap;
  try {
    if (!cap.crop || cap.cropRectKey !== JSON.stringify(cap.rect)) {
      cap.crop = await makeCrop();
      cap.cropRectKey = JSON.stringify(cap.rect);
      if (cap.cropURL) URL.revokeObjectURL(cap.cropURL);
      cap.cropURL = URL.createObjectURL(cap.crop);
    }
  } catch (e) { toast(e.message || '裁剪失败'); return; }
  cap.step = 'identifying'; cap.error = '';
  cap.ctl = new AbortController();
  renderCapture();
  try {
    const image = await blobToDataURL(cap.crop);
    const res = await api('/identify', { image, organ: cap.organ }, { signal: cap.ctl.signal, timeout: 150000 });
    if (cap !== my) return;
    cap.res = res;
    const cands = (res.result && res.result.candidates) || [];
    cap.choice = cands.length ? 0 : 'unknown';
    cap.step = 'confirm';
  } catch (e) {
    if (cap !== my) return;
    if (e.code === 'cancelled') { cap.step = 'crop'; renderCapture(); return; }
    cap.error = e.message; cap.step = 'error';
  }
  renderCapture();
}
async function commit(andDraw) {
  const r = (cap.res && cap.res.result) || {};
  let species = null;
  if (cap.choice === 'manual') {
    const zh = ($('#m-zh') ? $('#m-zh').value : '').trim(), latin = ($('#m-latin') ? $('#m-latin').value : '').trim();
    if (!zh && !latin) { toast('填一下名字，或者选「先记为待定」'); return; }
    species = { zh, latin, family_zh: '', family_latin: '', genus_zh: '', genus_latin: '', confidence: null, why: '', manual: true };
  } else if (typeof cap.choice === 'number' && (r.candidates || [])[cap.choice]) {
    species = { ...r.candidates[cap.choice] };
  }
  if (!cap.crop) { try { cap.crop = await makeCrop(); } catch { toast('裁剪失败'); return; } }
  const no = entries.reduce((m, e) => Math.max(m, e.no || 0), 0) + 1;
  const entry = {
    id: newId(), no, createdAt: new Date().toISOString(),
    place: (cap.place || '').trim(), organ: cap.organ,
    crop: cap.crop, drawing: null, drawStatus: 'none', drawError: '',
    species, candidates: r.candidates || [], features: r.features || [], form: r.form || '',
    aiNote: ($('#c-obs') ? $('#c-obs').value : (r.note || '')).trim(),
    myNote: ($('#c-mine') ? $('#c-mine').value : '').trim(),
    drawHint: r.draw_hint || '', plantnet: (cap.res && cap.res.plantnet) || null,
  };
  try { await saveEntry(entry); } catch (e) { toast('存不进去：' + (e.message || e)); return; }
  settings.lastPlace = entry.place; saveSettings();
  closeCaptureUI();
  nav('#/e/' + encodeURIComponent(entry.id), { replace: true });
  if (andDraw) {
    if (configured()) startDraw(entry.id);
    else toast('还没连上中转，先记下了，填好设置再画');
  }
}

/* ================= 启动 ================= */
(async function boot() {
  history.replaceState({ depth: 0 }, '', location.hash || '#/');
  try { await loadEntries(); } catch (e) { toast('读不了本机数据：' + (e.message || e)); }
  // 上次画到一半页面被关掉的，标记为没画成
  for (const e of entries) {
    if (e.drawStatus === 'drawing') { e.drawStatus = 'failed'; e.drawError = '上次画到一半，页面被关掉了'; await saveEntry(e).catch(() => {}); }
  }
  route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
